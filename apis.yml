aid: laserhub
name: Laserhub
description: 'Laserhub is a Stuttgart-based digital procurement platform for custom-manufactured
  metal and plastic parts, founded to replace the traditional RFQ cycle for sheet metal, tube and
  machined components with instant online quoting. Buyers register at app.laserhub.com, upload CAD
  files, and receive an automated feasibility check plus an instant quote covering laser cutting,
  plasma and flame cutting, tube laser cutting, bending, CNC turning and milling, weldments, and
  secondary processes such as threading, deburring, galvanising, powder coating and engraving.
  Laserhub is itself the contracting party and allocates each order algorithmically across a
  network of roughly 100 ISO 9001:2015 certified producers in Germany, Austria and Switzerland,
  serving both SMEs and DAX40 manufacturers with framework agreements, a parts library, sample
  parts, inspection certificates and design guidelines. Laserhub publishes no public developer API,
  SDK, or API documentation as of this profile: api.laserhub.com is a private AWS API Gateway that
  rejects unauthenticated requests, and the only machine-adjacent ordering channel the company
  documents is an email-based ordering flow (anfrage@laserhub.com) that its own release notes
  describe as still in a test phase for a subset of customers.'
